# --- Notifications (named placeholders: {equipment} {renter} {owner} {start} {end}) ---
error.notification.notFound=నోటిఫికేషన్ కనబడలేదు.
validation.fcmToken.required=పరికర టోకెన్ లేదు.
notification.BOOKING_REQUESTED.title=కొత్త బుకింగ్ అభ్యర్థన
notification.BOOKING_REQUESTED.body={renter} మీ {equipment}‌ను {start} నుండి {end} వరకు అద్దెకు తీసుకోవాలనుకుంటున్నారు.
notification.BOOKING_CONFIRMED.title=బుకింగ్ నిర్ధారించబడింది
notification.BOOKING_CONFIRMED.body={start} నుండి {end} వరకు {equipment} బుకింగ్‌ను {owner} నిర్ధారించారు. ఇప్పుడు మీరు ఒకరికొకరు ఫోన్ చేసుకోవచ్చు.
notification.BOOKING_REJECTED.title=బుకింగ్ తిరస్కరించబడింది
notification.BOOKING_REJECTED.body={equipment} బుకింగ్‌ను {owner} అంగీకరించలేకపోయారు. నిలిపిన డబ్బు విడుదల చేయబడింది.
notification.BOOKING_CANCELLED.title=బుకింగ్ రద్దు
notification.BOOKING_CANCELLED.body={start} నుండి {end} వరకు {equipment} బుకింగ్ రద్దు చేయబడింది.
notification.BOOKING_COMPLETED.title=అనుభవం ఎలా ఉంది?
notification.BOOKING_COMPLETED.body={equipment} అద్దె పూర్తయింది. దయచేసి {owner}‌కు రేటింగ్ ఇవ్వండి.
notification.BOOKING_EXPIRED.title=బుకింగ్ గడువు ముగిసింది
notification.BOOKING_EXPIRED.body={start} నుండి {end} వరకు {equipment} బుకింగ్ గడువు ముగిసింది, తేదీలు మళ్ళీ ఖాళీగా ఉన్నాయి.

