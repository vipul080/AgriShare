# --- Notifications (named placeholders: {equipment} {renter} {owner} {start} {end}) ---
error.notification.notFound=सूचना सापडली नाही.
validation.fcmToken.required=डिव्हाइस टोकन मिळाले नाही.
notification.BOOKING_REQUESTED.title=नवीन बुकिंग विनंती
notification.BOOKING_REQUESTED.body={renter} यांना तुमचे {equipment} {start} ते {end} भाड्याने हवे आहे.
notification.BOOKING_CONFIRMED.title=बुकिंग निश्चित झाले
notification.BOOKING_CONFIRMED.body={owner} यांनी {start} ते {end} साठी {equipment} चे तुमचे बुकिंग निश्चित केले. आता तुम्ही एकमेकांना फोन करू शकता.
notification.BOOKING_REJECTED.title=बुकिंग नाकारले
notification.BOOKING_REJECTED.body={owner} {equipment} चे तुमचे बुकिंग स्वीकारू शकले नाहीत. रोखलेली रक्कम परत केली आहे.
notification.BOOKING_CANCELLED.title=बुकिंग रद्द
notification.BOOKING_CANCELLED.body={start} ते {end} साठी {equipment} चे बुकिंग रद्द झाले.
notification.BOOKING_COMPLETED.title=अनुभव कसा होता?
notification.BOOKING_COMPLETED.body={equipment} चे तुमचे भाडे पूर्ण झाले. कृपया {owner} यांना रेटिंग द्या.
notification.BOOKING_EXPIRED.title=बुकिंगची मुदत संपली
notification.BOOKING_EXPIRED.body={start} ते {end} साठी {equipment} च्या बुकिंगची मुदत संपली आणि तारखा पुन्हा मोकळ्या आहेत.

