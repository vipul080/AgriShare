# --- Notifications (named placeholders: {equipment} {renter} {owner} {start} {end}) ---
error.notification.notFound=सूचना नहीं मिली।
validation.fcmToken.required=डिवाइस टोकन नहीं मिला।
notification.BOOKING_REQUESTED.title=नया बुकिंग अनुरोध
notification.BOOKING_REQUESTED.body={renter} आपका {equipment} {start} से {end} तक किराये पर लेना चाहते हैं।
notification.BOOKING_CONFIRMED.title=बुकिंग पक्की हुई
notification.BOOKING_CONFIRMED.body={owner} ने {start} से {end} तक {equipment} की आपकी बुकिंग पक्की कर दी। अब आप एक-दूसरे को फ़ोन कर सकते हैं।
notification.BOOKING_REJECTED.title=बुकिंग अस्वीकार
notification.BOOKING_REJECTED.body={owner} {equipment} की आपकी बुकिंग स्वीकार नहीं कर सके। रोकी गई राशि वापस कर दी गई है।
notification.BOOKING_CANCELLED.title=बुकिंग रद्द
notification.BOOKING_CANCELLED.body={start} से {end} तक {equipment} की बुकिंग रद्द कर दी गई।
notification.BOOKING_COMPLETED.title=अनुभव कैसा रहा?
notification.BOOKING_COMPLETED.body={equipment} का आपका किराया पूरा हुआ। कृपया {owner} को रेटिंग दें।
notification.BOOKING_EXPIRED.title=बुकिंग की समय-सीमा समाप्त
notification.BOOKING_EXPIRED.body={start} से {end} तक {equipment} की बुकिंग की समय-सीमा समाप्त हो गई और तारीखें फिर से खाली हैं।

