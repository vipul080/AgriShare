# Tamil — தமிழ்

# --- API errors ---
error.badInput=கோரிக்கையைப் படிக்க முடியவில்லை. தகவலைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.
error.credentials.invalid=தொலைபேசி/மின்னஞ்சல் அல்லது கடவுச்சொல் தவறானது.
error.email.exists=இந்த மின்னஞ்சல் ஏற்கனவே பதிவு செய்யப்பட்டுள்ளது.
error.equipment.notFound=இயந்திரம் கிடைக்கவில்லை.
error.equipment.notOwner=உரிமையாளர் மட்டுமே இந்த இயந்திரத்தை மாற்ற முடியும்.
error.forbidden=இதைச் செய்ய உங்களுக்கு அனுமதி இல்லை.
error.generic=ஏதோ தவறு நடந்தது. மீண்டும் முயற்சிக்கவும்.
error.image.empty=பதிவேற்ற ஒரு புகைப்படத்தைத் தேர்ந்தெடுக்கவும்.
error.image.tooLarge=புகைப்படம் மிகப் பெரியது. அதிகபட்ச அளவு 5 MB.
error.image.type=JPG, PNG அல்லது WebP புகைப்படங்கள் மட்டுமே அனுமதிக்கப்படும்.
error.notFound=கிடைக்கவில்லை.
error.phone.exists=இந்த தொலைபேசி எண் ஏற்கனவே பதிவு செய்யப்பட்டுள்ளது.
error.user.notFound=பயனர் கிடைக்கவில்லை.
error.validation=குறிக்கப்பட்ட தகவல்களைத் திருத்தவும்.

