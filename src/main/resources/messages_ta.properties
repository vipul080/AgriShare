validation.equipment.price.max=ஒரு நாள் வாடகை ₹1,00,000-க்கு மேல் இருக்கக்கூடாது.
validation.equipment.price.min=ஒரு நாள் வாடகை குறைந்தது ₹1 இருக்க வேண்டும்.
