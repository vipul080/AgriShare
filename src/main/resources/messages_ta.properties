notification.BOOKING_REQUESTED.title=புதிய முன்பதிவு கோரிக்கை
notification.BOOKING_REQUESTED.body={renter} உங்கள் {equipment}-ஐ {start} முதல் {end} வரை வாடகைக்கு எடுக்க விரும்புகிறார்.
notification.BOOKING_CONFIRMED.title=முன்பதிவு உறுதியானது
notification.BOOKING_CONFIRMED.body={start} முதல் {end} வரை {equipment} முன்பதிவை {owner} உறுதிசெய்தார். இப்போது நீங்கள் ஒருவரையொருவர் அழைக்கலாம்.
notification.BOOKING_REJECTED.title=முன்பதிவு நிராகரிக்கப்பட்டது
notification.BOOKING_REJECTED.body={equipment} முன்பதிவை {owner} ஏற்க முடியவில்லை. நிறுத்தி வைக்கப்பட்ட பணம் விடுவிக்கப்பட்டது.
notification.BOOKING_CANCELLED.title=முன்பதிவு ரத்து
notification.BOOKING_CANCELLED.body={start} முதல் {end} வரையிலான {equipment} முன்பதிவு ரத்து செய்யப்பட்டது.
notification.BOOKING_COMPLETED.title=அனுபவம் எப்படி இருந்தது?
notification.BOOKING_COMPLETED.body={equipment} வாடகை நிறைவடைந்தது. தயவுசெய்து {owner}-க்கு மதிப்பீடு அளிக்கவும்.
notification.BOOKING_EXPIRED.title=முன்பதிவு காலாவதியானது
notification.BOOKING_EXPIRED.body={start} முதல் {end} வரையிலான {equipment} முன்பதிவு காலாவதியானது, தேதிகள் மீண்டும் காலியாக உள்ளன.

