# --- Bookings & payments ---
error.booking.notFound=முன்பதிவு கிடைக்கவில்லை.
error.booking.pastDate=தொடக்க தேதி கடந்த தேதியாக இருக்கக்கூடாது.
error.booking.endBeforeStart=முடிவு தேதி தொடக்க தேதிக்குப் பிறகு அல்லது அதே நாளில் இருக்க வேண்டும்.
error.booking.tooLong=ஒரு முன்பதிவு அதிகபட்சம் {0} நாட்கள் இருக்கலாம்.
error.booking.tooFarAhead=அதிகபட்சம் {0} நாட்களுக்கு முன்பே முன்பதிவு செய்யலாம்.
error.booking.ownEquipment=உங்கள் சொந்த இயந்திரத்தை முன்பதிவு செய்ய முடியாது.
error.booking.unavailable=இந்த இயந்திரம் தற்போது முன்பதிவுகளை ஏற்கவில்லை.
error.booking.overlap=இந்த தேதிகள் ஏற்கனவே முன்பதிவு செய்யப்பட்டுள்ளன. வேறு தேதிகளைத் தேர்ந்தெடுக்கவும்.
error.booking.notRenter=முன்பதிவு செய்த விவசாயி மட்டுமே இதைச் செய்ய முடியும்.
error.booking.notOwner=இயந்திரத்தின் உரிமையாளர் மட்டுமே இதைச் செய்ய முடியும்.
error.booking.invalidState=இந்த முன்பதிவை இனி இவ்வாறு மாற்ற முடியாது.
error.booking.alreadyStarted=முன்பதிவு ஏற்கனவே தொடங்கிவிட்டது, அதை ரத்து செய்ய முடியாது.
error.booking.notStarted=தொடக்க தேதிக்கு முன் முன்பதிவை நிறைவு செய்ய முடியாது.
error.payment.orderMismatch=பணம் செலுத்துதல் இந்த முன்பதிவுடன் பொருந்தவில்லை.
error.payment.invalidSignature=பணம் செலுத்துதலைச் சரிபார்க்க முடியவில்லை. பணம் எதுவும் எடுக்கப்படவில்லை.
error.payment.gateway=பணம் செலுத்தும் சேவை பதிலளிக்கவில்லை. சிறிது நேரம் கழித்து முயற்சிக்கவும்.
error.conflict=வேறொருவர் அதே நேரத்தில் இதை மாற்றினார். புதுப்பித்து மீண்டும் முயற்சிக்கவும்.
validation.booking.equipment.required=முன்பதிவு செய்ய இயந்திரத்தைத் தேர்ந்தெடுக்கவும்.
validation.booking.startDate.required=தொடக்க தேதியைத் தேர்ந்தெடுக்கவும்.
validation.booking.endDate.required=முடிவு தேதியைத் தேர்ந்தெடுக்கவும்.
validation.booking.paymentMethod.required=பணம் செலுத்தும் முறையைத் தேர்ந்தெடுக்கவும்.
validation.payment.fields.required=பணம் செலுத்திய விவரங்கள் இல்லை.

# --- Notifications (named placeholders: {equipment} {renter} {owner} {start} {end}) ---
