# Tamil — தமிழ்

# --- API errors ---
error.badInput=கோரிக்கையைப் படிக்க முடியவில்லை. தகவலைச் சரிபார்த்து மீண்டும் முயற்சிக்கவும்.
error.credentials.invalid=தொலைபேசி/மின்னஞ்சல் அல்லது கடவுச்சொல் தவறானது.
error.email.exists=இந்த மின்னஞ்சல் ஏற்கனவே பதிவு செய்யப்பட்டுள்ளது.
error.equipment.notFound=இயந்திரம் கிடைக்கவில்லை.
error.equipment.notOwner=உரிமையாளர் மட்டுமே இந்த இயந்திரத்தை மாற்ற முடியும்.
error.forbidden=இதைச் செய்ய உங்களுக்கு அனுமதி இல்லை.
error.generic=ஏதோ தவறு நடந்தது. மீண்டும் முயற்சிக்கவும்.
error.image.empty=பதிவேற்ற ஒரு புகைப்படத்தைத் தேர்ந்தெடுக்கவும்.
error.image.tooLarge=புகைப்படம் மிகப் பெரியது. அதிகபட்ச அளவு 5 MB.
error.image.type=JPG, PNG அல்லது WebP புகைப்படங்கள் மட்டுமே அனுமதிக்கப்படும்.
error.notFound=கிடைக்கவில்லை.
error.phone.exists=இந்த தொலைபேசி எண் ஏற்கனவே பதிவு செய்யப்பட்டுள்ளது.
error.user.notFound=பயனர் கிடைக்கவில்லை.
error.validation=குறிக்கப்பட்ட தகவல்களைத் திருத்தவும்.

# --- Field validation ---
validation.email.invalid=சரியான மின்னஞ்சல் முகவரியை உள்ளிடவும்.
validation.equipment.category.required=ஒரு வகையைத் தேர்ந்தெடுக்கவும்.
validation.equipment.name.required=இயந்திரத்தின் பெயரை உள்ளிடவும்.
validation.equipment.price.max=ஒரு நாள் வாடகை ₹1,00,000-க்கு மேல் இருக்கக்கூடாது.
validation.equipment.price.min=ஒரு நாள் வாடகை குறைந்தது ₹1 இருக்க வேண்டும்.
validation.equipment.price.required=ஒரு நாள் வாடகையை உள்ளிடவும்.
validation.identifier.required=உங்கள் தொலைபேசி எண் அல்லது மின்னஞ்சலை உள்ளிடவும்.
validation.language.invalid=இந்த மொழி கிடைக்கவில்லை.
validation.location.required=இருப்பிடம் தேவை.
validation.name.required=உங்கள் பெயரை உள்ளிடவும்.
validation.password.required=உங்கள் கடவுச்சொல்லை உள்ளிடவும்.
validation.password.size=கடவுச்சொல் 8 முதல் 72 எழுத்துகள் இருக்க வேண்டும்.
validation.phone.invalid=சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்.
validation.phone.required=உங்கள் மொபைல் எண்ணை உள்ளிடவும்.

# --- Bookings & payments ---
error.booking.notFound=முன்பதிவு கிடைக்கவில்லை.
error.booking.pastDate=தொடக்க தேதி கடந்த தேதியாக இருக்கக்கூடாது.
error.booking.endBeforeStart=முடிவு தேதி தொடக்க தேதிக்குப் பிறகு அல்லது அதே நாளில் இருக்க வேண்டும்.
error.booking.tooLong=ஒரு முன்பதிவு அதிகபட்சம் {0} நாட்கள் இருக்கலாம்.
error.booking.tooFarAhead=அதிகபட்சம் {0} நாட்களுக்கு முன்பே முன்பதிவு செய்யலாம்.
error.booking.ownEquipment=உங்கள் சொந்த இயந்திரத்தை முன்பதிவு செய்ய முடியாது.
error.booking.unavailable=இந்த இயந்திரம் தற்போது முன்பதிவுகளை ஏற்கவில்லை.
error.booking.overlap=இந்த தேதிகள் ஏற்கனவே முன்பதிவு செய்யப்பட்டுள்ளன. வேறு தேதிகளைத் தேர்ந்தெடுக்கவும்.
error.booking.notRenter=முன்பதிவு செய்த விவசாயி மட்டுமே இதைச் செய்ய முடியும்.
error.booking.notOwner=இயந்திரத்தின் உரிமையாளர் மட்டுமே இதைச் செய்ய முடியும்.
error.booking.invalidState=இந்த முன்பதிவை இனி இவ்வாறு மாற்ற முடியாது.
error.booking.alreadyStarted=முன்பதிவு ஏற்கனவே தொடங்கிவிட்டது, அதை ரத்து செய்ய முடியாது.
error.booking.notStarted=தொடக்க தேதிக்கு முன் முன்பதிவை நிறைவு செய்ய முடியாது.
error.payment.orderMismatch=பணம் செலுத்துதல் இந்த முன்பதிவுடன் பொருந்தவில்லை.
error.payment.invalidSignature=பணம் செலுத்துதலைச் சரிபார்க்க முடியவில்லை. பணம் எதுவும் எடுக்கப்படவில்லை.
error.payment.gateway=பணம் செலுத்தும் சேவை பதிலளிக்கவில்லை. சிறிது நேரம் கழித்து முயற்சிக்கவும்.
error.conflict=வேறொருவர் அதே நேரத்தில் இதை மாற்றினார். புதுப்பித்து மீண்டும் முயற்சிக்கவும்.
validation.booking.equipment.required=முன்பதிவு செய்ய இயந்திரத்தைத் தேர்ந்தெடுக்கவும்.
validation.booking.startDate.required=தொடக்க தேதியைத் தேர்ந்தெடுக்கவும்.
validation.booking.endDate.required=முடிவு தேதியைத் தேர்ந்தெடுக்கவும்.
validation.booking.paymentMethod.required=பணம் செலுத்தும் முறையைத் தேர்ந்தெடுக்கவும்.
validation.payment.fields.required=பணம் செலுத்திய விவரங்கள் இல்லை.

# --- Notifications (named placeholders: {equipment} {renter} {owner} {start} {end}) ---
error.notification.notFound=அறிவிப்பு கிடைக்கவில்லை.
validation.fcmToken.required=சாதன டோக்கன் இல்லை.
notification.BOOKING_REQUESTED.title=புதிய முன்பதிவு கோரிக்கை
notification.BOOKING_REQUESTED.body={renter} உங்கள் {equipment}-ஐ {start} முதல் {end} வரை வாடகைக்கு எடுக்க விரும்புகிறார்.
notification.BOOKING_CONFIRMED.title=முன்பதிவு உறுதியானது
notification.BOOKING_CONFIRMED.body={start} முதல் {end} வரை {equipment} முன்பதிவை {owner} உறுதிசெய்தார். இப்போது நீங்கள் ஒருவரையொருவர் அழைக்கலாம்.
notification.BOOKING_REJECTED.title=முன்பதிவு நிராகரிக்கப்பட்டது
notification.BOOKING_REJECTED.body={equipment} முன்பதிவை {owner} ஏற்க முடியவில்லை. நிறுத்தி வைக்கப்பட்ட பணம் விடுவிக்கப்பட்டது.
notification.BOOKING_CANCELLED.title=முன்பதிவு ரத்து
notification.BOOKING_CANCELLED.body={start} முதல் {end} வரையிலான {equipment} முன்பதிவு ரத்து செய்யப்பட்டது.
notification.BOOKING_COMPLETED.title=அனுபவம் எப்படி இருந்தது?
notification.BOOKING_COMPLETED.body={equipment} வாடகை நிறைவடைந்தது. தயவுசெய்து {owner}-க்கு மதிப்பீடு அளிக்கவும்.
notification.BOOKING_EXPIRED.title=முன்பதிவு காலாவதியானது
notification.BOOKING_EXPIRED.body={start} முதல் {end} வரையிலான {equipment} முன்பதிவு காலாவதியானது, தேதிகள் மீண்டும் காலியாக உள்ளன.
