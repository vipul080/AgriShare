# --- Notifications (named placeholders: {equipment} {renter} {owner} {start} {end}) ---
error.notification.notFound=સૂચના મળી નહીં.
validation.fcmToken.required=ડિવાઇસ ટોકન મળ્યું નહીં.
notification.BOOKING_REQUESTED.title=નવી બુકિંગ વિનંતી
notification.BOOKING_REQUESTED.body={renter} તમારું {equipment} {start} થી {end} સુધી ભાડે લેવા માંગે છે.
notification.BOOKING_CONFIRMED.title=બુકિંગ પાકું થયું
notification.BOOKING_CONFIRMED.body={owner} એ {start} થી {end} સુધી {equipment} નું તમારું બુકિંગ પાકું કર્યું. હવે તમે એકબીજાને ફોન કરી શકો છો.
notification.BOOKING_REJECTED.title=બુકિંગ નામંજૂર
notification.BOOKING_REJECTED.body={owner} {equipment} નું તમારું બુકિંગ સ્વીકારી શક્યા નહીં. રોકાયેલી રકમ પરત કરવામાં આવી છે.
notification.BOOKING_CANCELLED.title=બુકિંગ રદ
notification.BOOKING_CANCELLED.body={start} થી {end} સુધી {equipment} નું બુકિંગ રદ કરવામાં આવ્યું.
notification.BOOKING_COMPLETED.title=અનુભવ કેવો રહ્યો?
notification.BOOKING_COMPLETED.body={equipment} નું તમારું ભાડું પૂર્ણ થયું. કૃપા કરીને {owner} ને રેટિંગ આપો.
notification.BOOKING_EXPIRED.title=બુકિંગની મુદત પૂરી
notification.BOOKING_EXPIRED.body={start} થી {end} સુધી {equipment} ના બુકિંગની મુદત પૂરી થઈ અને તારીખો ફરી ખાલી છે.

