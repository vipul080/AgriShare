spring:
  application:
    name: agrishare

  datasource:
    # DB_URL wins; otherwise built from the parts Render/Railway expose (DB_HOST, DB_PORT, DB_NAME)
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agrishare}}
    username: ${DB_USERNAME:agrishare}
    password: ${DB_PASSWORD:agrishare}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    resources:
      cache:
        # UI files change with every release: phones revalidate (cheap 304) instead of running stale JS
        cachecontrol:
          no-cache: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  # behind the host's HTTPS proxy: trust X-Forwarded-* so the app knows it is served over https
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

app:
  jwt:
    # 32+ random characters, only ever from the APP_JWT_SECRET env var (the repo is public).
    # Unset: a random key per start, so local logins just reset when you restart.
    secret: ${APP_JWT_SECRET:}
    expiration-ms: 604800000   # 7 days — farmers shouldn't need to log in every day
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  # Sample farmers + machines around Paonta Sahib, only into an empty DB. Keep false in production
  # so real farmers never see made-up listings; set APP_DEMO_DATA=true for demos.
  demo-data: ${APP_DEMO_DATA:false}
  push:
    # "log" = print pushes to the log; "fcm" = Firebase Cloud Messaging (added with the Android app)
    mode: ${PUSH_MODE:log}
  # How the platform earns — both OFF by default so farmers aren't put off early on.
  # Cash bookings are never charged extra; fees are always shown before paying.
  earnings:
    online-fee-percent: ${ONLINE_FEE_PERCENT:0}   # e.g. 2 = 2% added to ONLINE payments only
    online-fee-cap: ${ONLINE_FEE_CAP:20}          # rupees; fee never exceeds this
    boost:
      enabled: ${BOOST_ENABLED:false}             # owners may pay to show a machine at the top
      price: ${BOOST_PRICE:49}
      days: ${BOOST_DAYS:7}
  payments:
    # "off" = cash only (use this in production until Razorpay is set up and tested)
    # "mock" = pretend payments for local development and demos ONLY - never for real farmers
    # "razorpay" = real Razorpay (test keys first, live keys after approval)
    mode: ${PAYMENTS_MODE:mock}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
    # Razorpay auto-refunds payments left "authorized" for 5 days; expire bookings safely before that
    authorization-expiry-hours: 96
    # How long a booking may sit waiting for the renter to finish paying
    checkout-timeout-minutes: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
