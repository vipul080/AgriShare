spring:
  application:
    name: agrishare

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrishare}
    username: ${DB_USERNAME:agrishare}
    password: ${DB_PASSWORD:agrishare}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

app:
  jwt:
    # 32+ char secret required for HS256; override via APP_JWT_SECRET env var in real deployments
    secret: ${APP_JWT_SECRET:this-is-a-placeholder-dev-secret-change-me-please}
    expiration-ms: 604800000   # 7 days — farmers shouldn't need to log in every day
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  # Seeds a few demo farmers + machines around Paonta Sahib when the DB is empty
  demo-data: ${APP_DEMO_DATA:true}
  push:
    # "log" = print pushes to the log; "fcm" = Firebase Cloud Messaging (added with the Android app)
    mode: ${PUSH_MODE:log}
  payments:
    # "mock" = simulated payments for local/demo use; "razorpay" = real Razorpay (test or live keys)
    mode: ${PAYMENTS_MODE:mock}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
    # Razorpay auto-refunds payments left "authorized" for 5 days; expire bookings safely before that
    authorization-expiry-hours: 96
    # How long a booking may sit waiting for the renter to finish paying
    checkout-timeout-minutes: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
